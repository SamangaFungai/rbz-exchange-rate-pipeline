<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RBZ Exchange Rates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js';document.head.appendChild(s)"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #06231a;
    --card: #0d3325;
    --line: #154736;
    --text: #f5f1e0;
    --muted: #8fb5a2;
    --gold: #e0b13a;
    --emerald: #2f8f6b;
    --display: 'Fraunces', Georgia, serif;
    --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2.5rem 1rem 4rem; background: var(--bg); color: var(--text); font-family: var(--body); line-height: 1.5; }
  .wrap { max-width: 960px; margin: 0 auto; }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem 1.5rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid var(--gold); }
  h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(1.7rem, 4vw, 2.3rem); letter-spacing: -0.01em; }
  .updated { color: var(--muted); font-size: 0.9rem; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.15rem; }
  .stat span { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.15rem; }
  .stat b { font-family: var(--display); font-weight: 500; font-size: 1.9rem; }
  .stat.key b { color: var(--gold); }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.15rem; margin-bottom: 1.5rem; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; }
  h2 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 1.25rem; }
  .chart-box { position: relative; height: 320px; }

  label { color: var(--muted); font-size: 0.85rem; margin-right: 0.5rem; }
  select, input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 0.5rem 0.7rem; font: inherit; font-size: 0.9rem; }
  input { width: 100%; max-width: 240px; }
  input::placeholder { color: var(--muted); opacity: 0.8; }
  select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  th, td { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--line); }
  th { color: var(--gold); font-weight: 500; font-size: 0.85rem; position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--gold); }
  th.r, td.r { text-align: right; }
  tbody tr:hover { background: rgba(47, 143, 107, 0.15); }
  td:first-child { font-weight: 500; }
  .empty { color: var(--muted); padding: 1rem 0.75rem; }

  footer { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 0.85rem; }
  footer a { color: var(--gold); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 2px; }

  @media (max-width: 520px) {
    body { padding-top: 1.5rem; }
    .chart-box { height: 260px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RBZ exchange rates</h1>
    <div class="updated" id="updated">Loading…</div>
  </header>

  <section class="stats" aria-label="Latest rates">
    <div class="stat key"><span>USD / ZWG</span><b class="num" id="statUsd">–</b></div>
    <div class="stat"><span>ZAR / ZWG</span><b class="num" id="statZar">–</b></div>
    <div class="stat"><span>Currencies</span><b class="num" id="statCount">–</b></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Trend</h2>
      <div>
        <label for="currencySelect">Currency</label>
        <select id="currencySelect"></select>
      </div>
    </div>
    <div class="chart-box"><canvas id="trendChart" aria-label="Rate trend chart" role="img"></canvas></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Latest rates</h2>
      <input id="filter" type="search" placeholder="Filter currency" aria-label="Filter currency">
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Currency</th><th class="r">Index mid (vs USD)</th><th class="r">ZWG mid</th></tr></thead>
        <tbody id="ratesBody"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
fetch('data.json').then(r => r.json()).then(data => {
  const d = new Date(data.latest_date + 'T00:00:00');
  document.getElementById('updated').textContent = 'Updated ' + (isNaN(d)
    ? data.latest_date
    : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }));

  const find = code => data.latest.find(r => r.currency === code);
  const fmt = v => (v == null ? '–' : Number(v).toFixed(4));
  document.getElementById('statUsd').textContent = fmt(find('USD') && find('USD').zwg_mid);
  document.getElementById('statZar').textContent = fmt(find('ZAR') && find('ZAR').zwg_mid);
  document.getElementById('statCount').textContent = data.latest.length;

  const body = document.getElementById('ratesBody');
  function render(filter) {
    body.innerHTML = '';
    const rows = data.latest.filter(r => r.currency.toLowerCase().includes(filter.toLowerCase()));
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="3" class="empty">No currencies match that filter.</td></tr>';
      return;
    }
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.currency}</td><td class="r num">${r.idx_mid ?? ''}</td><td class="r num">${r.zwg_mid ?? ''}</td>`;
      body.appendChild(tr);
    });
  }
  render('');
  document.getElementById('filter').addEventListener('input', e => render(e.target.value));

  const select = document.getElementById('currencySelect');
  Object.keys(data.history).sort().forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    select.appendChild(opt);
  });
  select.value = 'USD' in data.history ? 'USD' : select.options[0].value;

  let chart;
  function drawChart(currency) {
    try { buildChart(currency); } catch (e) {
      console.error(e);
      document.getElementById('updated').textContent = 'Chart error: ' + e.message;
    }
  }
  function buildChart(currency) {
    const series = data.history[currency] || [];
    const ctx = document.getElementById('trendChart').getContext('2d');
    if (chart) chart.destroy();
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: series.map(p => p.date),
        datasets: [{
          label: currency + ' ZWG mid',
          data: series.map(p => p.zwg_mid),
          borderColor: '#e0b13a',
          backgroundColor: 'rgba(47,143,107,0.22)',
          borderWidth: 2.5,
          fill: true,
          tension: 0.25,
          pointRadius: 0,
          pointHoverRadius: 5,
          pointHoverBackgroundColor: '#e0b13a',
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#06231a',
            borderColor: '#e0b13a',
            borderWidth: 1,
            titleColor: '#8fb5a2',
            bodyColor: '#f5f1e0',
            padding: 10,
            displayColors: false,
            callbacks: { label: c => currency + ' ' + c.formattedValue + ' ZWG' }
          }
        },
        scales: {
          x: { ticks: { color: '#8fb5a2', maxTicksLimit: 8 }, grid: { color: '#154736' }, border: { color: '#154736' } },
          y: { ticks: { color: '#8fb5a2' }, grid: { color: '#154736' }, border: { display: false } }
        }
      }
    });
  }
  drawChart(select.value);
  select.addEventListener('change', () => drawChart(select.value));
}).catch(e => {
  console.error(e);
  document.getElementById('updated').textContent = "Couldn't load the rates: " + e.message;
});
</script>
</body>
</html>
