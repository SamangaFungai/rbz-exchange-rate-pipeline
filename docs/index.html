<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RBZ Exchange Rates</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#0f1115; color:#e8e8e8; margin:0; padding:2rem 1rem; }
  h1 { font-size:1.4rem; margin-bottom:0.2rem; }
  .updated { color:#9aa0a6; font-size:0.85rem; margin-bottom:1.5rem; }
  .wrap { max-width:900px; margin:0 auto; }
  select { background:#1b1e24; color:#e8e8e8; border:1px solid #333; padding:0.4rem 0.6rem; border-radius:6px; margin-bottom:1rem; }
  canvas { max-height:340px; margin-bottom:2rem; }
  table { width:100%; border-collapse:collapse; font-size:0.9rem; }
  th, td { text-align:left; padding:0.4rem 0.6rem; border-bottom:1px solid #262930; }
  th { color:#9aa0a6; font-weight:600; position:sticky; top:0; background:#0f1115; }
  input { background:#1b1e24; color:#e8e8e8; border:1px solid #333; padding:0.4rem 0.6rem; border-radius:6px; width:100%; max-width:220px; margin-bottom:0.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>RBZ Exchange Rates</h1>
  <div class="updated" id="updated">Loading…</div>

  <label for="currencySelect">Trend for:</label>
  <select id="currencySelect"></select>
  <canvas id="trendChart"></canvas>

  <input id="filter" placeholder="Filter currency…">
  <table>
    <thead><tr><th>Currency</th><th>Index mid (vs USD)</th><th>ZWG mid</th></tr></thead>
    <tbody id="ratesBody"></tbody>
  </table>
</div>

<script>
fetch('data.json').then(r => r.json()).then(data => {
  document.getElementById('updated').textContent = 'Latest: ' + data.latest_date;

  const body = document.getElementById('ratesBody');
  function render(filter) {
    body.innerHTML = '';
    data.latest
      .filter(r => r.currency.toLowerCase().includes(filter.toLowerCase()))
      .forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${r.currency}</td><td>${r.idx_mid ?? ''}</td><td>${r.zwg_mid ?? ''}</td>`;
        body.appendChild(tr);
      });
  }
  render('');
  document.getElementById('filter').addEventListener('input', e => render(e.target.value));

  const select = document.getElementById('currencySelect');
  Object.keys(data.history).sort().forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    select.appendChild(opt);
  });
  select.value = 'USD' in data.history ? 'USD' : select.options[0].value;

  let chart;
  function drawChart(currency) {
    const series = data.history[currency] || [];
    const ctx = document.getElementById('trendChart').getContext('2d');
    if (chart) chart.destroy();
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: series.map(p => p.date),
        datasets: [{
          label: currency + ' ZWG mid',
          data: series.map(p => p.zwg_mid),
          borderColor: '#4f9eff',
          backgroundColor: 'rgba(79,158,255,0.15)',
          tension: 0.2,
          pointRadius: 0,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#e8e8e8' } } },
        scales: {
          x: { ticks: { color: '#9aa0a6', maxTicksLimit: 8 }, grid: { color: '#262930' } },
          y: { ticks: { color: '#9aa0a6' }, grid: { color: '#262930' } }
        }
      }
    });
  }
  drawChart(select.value);
  select.addEventListener('change', () => drawChart(select.value));
});
</script>
</body>
</html>
