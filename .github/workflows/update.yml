name: Update RBZ rates

on:
  schedule:
    - cron: "0 8,12,16 * * 1-5"   # 3 times each weekday (UTC)
  workflow_dispatch:               # lets you run it manually from GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backfill last 7 days
        run: python backfill.py --start $(date -d '7 days ago' +%F) --end $(date +%F)
      - run: python pipeline.py
      - run: python export_data.py
      - name: Commit and push
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add docs/data.json rbz_rates.db
          git diff --staged --quiet || git commit -m "Auto update rates"
          git push